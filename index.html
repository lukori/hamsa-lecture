<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איזה מזל</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'Plex', system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  body.idle { cursor: none; }

  .slide { position: absolute; inset: 0; overflow: hidden; opacity: 0; visibility: hidden;
           transition: opacity .6s ease, visibility 0s linear .6s; }
  .slide.on { opacity: 1; visibility: visible; transition: opacity .6s ease; }
  .slide.light { background: #fff; color: #000; }

  /* A photo that covers the screen; children are positioned in the photo's own % coordinates */
  .frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
           width: max(100vw, calc(100vh * var(--r))); aspect-ratio: var(--r); }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .over { position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
          color: #fff; font-weight: 600; line-height: 1; letter-spacing: -.01em;
          text-shadow: 0 .02em .25em rgba(0,0,0,.18); }
  .frame.top { top: 0; transform: translateX(-50%); }

  /* side-by-side photos, each fills its share of the screen */
  .split { position: absolute; inset: 0; display: flex; direction: ltr; }
  .split img { flex: 1; min-width: 0; height: 100%; object-fit: cover; display: block; }

  /* hero, same as the site's pink block */
  #hero { background: #f5124c; color: #fff; }
  .hero { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .hero-text { padding: 9vh 4.5vw; }
  .hero h1 { font-weight: 700; font-size: 10vw; white-space: nowrap; line-height: .92; letter-spacing: -.03em; }
  .hero .sub { margin-top: 1.6vw; font-size: 2.6vw; font-weight: 400; line-height: 1.25; }
  .hero .artist { margin-top: .4vw; font-size: 2.6vw; font-weight: 600; line-height: 1.25; }
  .hero-img {
    position: relative; width: 100%; height: 100%; overflow: hidden; cursor: pointer;
    --mx: linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
    --my: linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%);
    -webkit-mask-image: var(--mx), var(--my); -webkit-mask-composite: source-in;
    mask-image: var(--mx), var(--my); mask-composite: intersect;
  }
  .hero-photo { position: absolute; top: 0; left: 50%; height: 100%; aspect-ratio: 1640 / 954; transform: translateX(-50%);
                background: url(assets/hero-hamsa.png) 0 0 / 100% 100%; }
  .lens { position: absolute; left: 49.51%; top: 59.12%; width: 23.9%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; overflow: hidden; }
  .pupil { position: absolute; left: 22.5%; top: 22.5%; width: 55%; height: 55%; border-radius: 50%; background: #121110; will-change: transform; }
  .lens-gloss { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(ellipse 70% 84% at 36% 50%, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 84%, rgba(255,255,255,0.65) 90%, rgba(255,255,255,0.3) 96%, rgba(255,255,255,0) 100%); }
  .lens-shade { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(ellipse 60% 78% at 30% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 90%, rgba(80,60,70,0.10) 96%, rgba(0,0,0,0) 100%); }

  /* videos and portrait images, centered */
  .vid { position: absolute; inset: 0; display: grid; place-items: center; }
  .vid video, .vid .still { height: 86vh; max-width: 100vw; display: block; }
  .vid.full video, .vid.full .still { height: 100vh; }
  .still { position: relative; aspect-ratio: 648 / 950; }
  .still img { width: 100%; height: 100%; display: block; }
  .thanks { position: absolute; left: 50%; top: 86%; transform: translate(-50%, -50%);
            font-size: 2.6vh; font-weight: 400; color: #111; letter-spacing: .02em; }
  img.contain { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  .credit { position: absolute; bottom: 1.4vh; left: 1.6vw; direction: rtl;
            font-size: max(11px, .8vw); font-weight: 300; color: rgba(255,255,255,.85); }

  /* fade-up for text on photos */
  .over { opacity: 0; transition: opacity .45s ease .15s; }
  .on .over { opacity: 1; }
  #hello .over { opacity: 0; }          /* "אהלן" waits for a press */
  #hello.shown .over { opacity: 1; }

  /* interests diagram */
  #interests svg { position: absolute; inset: 4vh 4vw; width: calc(100% - 8vw); height: calc(100% - 8vh); }
  #interests circle { fill: none; stroke-width: 2.2; }
  #interests text { font-family: 'Plex', sans-serif; font-size: 40px; font-weight: 400; fill: #000;
                    text-anchor: middle; dominant-baseline: middle; direction: ltr; }

  /* rolling words */
  .roll { position: absolute; inset: 0 0 16vh; display: grid; place-items: center; }
  .word { grid-area: 1 / 1; font-size: 6.4vw; font-weight: 600; letter-spacing: -.02em; line-height: 1.1;
          text-align: center; padding: 0 5vw; opacity: 0; translate: 0 .6em;
          transition: opacity .35s ease, translate .45s cubic-bezier(.2,.8,.2,1); }
  .word.in  { opacity: 1; translate: 0 0; }
  .word.out { opacity: 0; translate: 0 -.6em; }
  .word.final { color: #f5124c; transition: opacity .35s ease, translate .45s cubic-bezier(.2,.8,.2,1), color .4s ease; }
  .word[dir=ltr] { direction: ltr; }
</style>
</head>
<body>

<!-- 1 · אהלן -->
<section class="slide" id="hello">
  <div class="frame top" style="--r: 2400/1472">
    <img src="assets/luka_mask_01.jpg" alt="">
  </div>
  <div class="over" style="right: 6vw; left: auto; top: 30vh; transform: translateY(-50%); font-size: 13vw;
       text-shadow: 0 .03em .06em rgba(0,0,0,.35), 0 .06em .3em rgba(0,0,0,.3);">אהלן</div>
</section>

<!-- 2 · interests -->
<section class="slide light" id="interests">
  <svg viewBox="267 80 1200 1310" preserveAspectRatio="xMidYMid meet">
    <g class="item"><circle cx="755"  cy="351"  r="247" stroke="#5aa64a"/><text x="755"  y="340">imaginative play</text></g>
    <g class="item"><circle cx="1061" cy="378"  r="155" stroke="#ee8a30"/><text x="1080" y="378">Interacting</text></g>
    <g class="item"><circle cx="598"  cy="671"  r="224" stroke="#7fadad"/><text x="540"  y="650">Social play</text></g>
    <g class="item"><circle cx="1025" cy="775"  r="335" stroke="#e0337f"/><text x="1060" y="750">Storytelling</text></g>
    <g class="item"><circle cx="718"  cy="1083" r="280" stroke="#3ea4e6"/><text x="718"  y="1145">Creative Play</text></g>
  </svg>
</section>

<!-- 3 · כובעים -->
<section class="slide light" id="hats">
  <div class="roll"></div>
</section>

<!-- 4 · איזה מזל (the site hero) -->
<section class="slide" id="hero">
  <div class="hero">
    <div class="hero-text">
      <h1>איזה מזל</h1>
      <p class="sub">מבט עכשווי על חמסה</p>
      <p class="artist">לוקה אור</p>
    </div>
    <div class="hero-img">
      <div class="hero-photo">
        <div class="lens">
          <div class="pupil"></div>
          <div class="lens-gloss"></div>
          <div class="lens-shade"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 5 · הקיר -->
<section class="slide" id="wall">
  <div class="frame" style="--r: 2048/1365">
    <img src="assets/dor2007.jpg" alt="">
  </div>
  <div class="credit">צילום: דור קדמון</div>
</section>

<!-- 6 · חלל התערוכה -->
<section class="slide" id="space">
  <div class="frame" style="--r: 2048/1365">
    <img src="assets/dor1996.jpg" alt="">
  </div>
  <div class="credit">צילום: דור קדמון</div>
</section>

<!-- 7 → 12 · objects -->
<section class="slide"><div class="frame" style="--r: 2400/1350"><img src="assets/mickey_w.jpg" alt=""></div></section>
<section class="slide"><div class="frame" style="--r: 1600/1067"><img src="assets/hamsa_360_01.webp" alt=""></div></section>
<section class="slide"><div class="split">
  <img src="assets/bubble_04.webp" alt=""><img src="assets/hamsabird_01.webp" alt="">
</div></section>
<section class="slide"><div class="split">
  <img src="assets/save_02.webp" alt=""><img src="assets/slinky_01.webp" alt="">
</div></section>
<section class="slide"><div class="split">
  <img src="assets/spoons.webp" alt="" style="flex: .8"><img src="assets/noisemaker_01.webp" alt="" style="flex: 1.2; object-fit: contain; padding: 9vh 1.5vw; background: #fefefe;"><img src="assets/cube_01.webp" alt="" style="flex: 1">
</div></section>
<section class="slide"><div class="frame" style="--r: 1"><img src="assets/pazam_all_02.webp" alt=""></div></section>
<section class="slide"><div class="frame" style="--r: 1387/780"><img src="assets/googly_couple.jpg" alt=""></div></section>

<!-- evening video: white / black versions -->
<section class="slide light" id="evening-w"><div class="vid"><video src="assets/evening.mp4" playsinline preload="auto"></video></div></section>
<section class="slide" id="emet">
  <img class="contain" src="assets/img3678.jpg" alt="">
</section>

<!-- balkan video, then its first frame with thanks -->
<section class="slide light" id="balkan"><div class="vid full"><video src="assets/balkan.mp4" playsinline preload="auto"></video></div></section>
<section class="slide light" id="thanks">
  <div class="vid full">
    <div class="still">
      <img src="assets/balkan_first.jpg" alt="">
      <div class="thanks">תודה</div>
    </div>
  </div>
</section>

<script>
const slides = [...document.querySelectorAll('.slide')];
let cur = 0;

/* ---------- interests: circles draw overlapping, in a scattered (fixed) order ---------- */
const interests = {
  timers: [],
  // per circle, in DOM order: [start ms, draw ms, start angle °, reverse direction]
  plan: [[650, 900, 160, false], [300, 700, -40, false], [950, 850, 30, false],
         [150, 1100, 200, false], [450, 1000, 90, true]],
  enter() {
    this.reset();
    document.querySelectorAll('#interests .item').forEach((g, i) => {
      const c = g.querySelector('circle'), t = g.querySelector('text');
      const [start, dur] = this.plan[i];
      this.timers.push(setTimeout(() => {
        c.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(.5,0,.2,1)`;
        c.style.strokeDashoffset = 0;
      }, start));
      this.timers.push(setTimeout(() => {
        t.style.transition = 'opacity .5s ease';
        t.style.opacity = 1;
      }, start + dur * 0.6));
    });
  },
  reset() {
    this.timers.forEach(clearTimeout); this.timers = [];
    document.querySelectorAll('#interests .item').forEach((g, i) => {
      const c = g.querySelector('circle'), t = g.querySelector('text');
      const [, , angle, reverse] = this.plan[i];
      const len = 2 * Math.PI * c.r.baseVal.value;
      c.setAttribute('transform', `rotate(${angle} ${c.cx.baseVal.value} ${c.cy.baseVal.value})`);
      c.style.transition = t.style.transition = 'none';
      c.style.strokeDasharray = len;
      c.style.strokeDashoffset = reverse ? -len : len;
      t.style.opacity = 0;
    });
  },
  leave() { this.reset(); },
};

/* ---------- hats: words roll in a loop until "next", then the final line ---------- */
const hats = {
  words: ['מעצב', 'מרצה', 'מעצב יוצר', 'מלמד AIxID', 'מעצב אינטראקציה', 'מעצב צעצועים',
          'מעצב מוצרים לבית', 'מעצב אופטימי'],
  last: 'מעצב אופטימי',
  speed: 1100,           // ms each word stays
  roll: document.querySelector('#hats .roll'),
  timer: null, i: 0, done: false, el: null,
  show(text) {
    if (this.el) { const old = this.el; old.classList.replace('in', 'out'); setTimeout(() => old.remove(), 500); }
    const w = document.createElement('div');
    w.className = 'word'; w.textContent = text;
    this.roll.append(w);
    requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('in')));
    this.el = w;
  },
  enter() {
    this.leave();
    this.done = false; this.i = 0;
    this.show(this.words[0]);
    this.timer = setInterval(() => {
      this.i = (this.i + 1) % this.words.length;
      this.show(this.words[this.i]);
    }, this.speed);
  },
  // returns true if it consumed the "next" press
  next() {
    if (this.done) return false;
    clearInterval(this.timer); this.done = true;
    if (this.el?.textContent !== this.last) this.show(this.last);
    this.el.classList.add('final');
    return true;
  },
  leave() { clearInterval(this.timer); this.roll.innerHTML = ''; this.el = null; },
};

let heroStart = 0;
const hero = { enter() { heroStart = performance.now(); } };

/* ---------- videos: first press plays, next press moves on ---------- */
const videoSlide = id => {
  const v = document.querySelector(`#${id} video`);
  let started = false;
  return {
    enter() { started = false; v.pause(); v.currentTime = 0; },
    next() {
      if (started) return false;
      started = true;
      // if the browser blocks sound without a user gesture, play muted rather than not at all
      v.play().catch(() => { v.muted = true; v.play(); });
      return true;
    },
    leave() { v.pause(); },
  };
};

/* ---------- hero: spring-driven pupil (same as the site), click the hamsa to shake ---------- */
(() => {
  const lens = document.querySelector('#hero .lens'), pupil = document.querySelector('#hero .pupil');
  const pos = { x: 0, y: 0 }, v = { x: 0, y: 0 };
  let mouse = null, lastMove = 0;
  window.addEventListener('mousemove', e => { mouse = { x: e.clientX, y: e.clientY }; lastMove = performance.now(); });
  // on its own the eye "reads": center → title (up-right) → subtitle (right) → center, looping
  const path = [[0, 0, 1000], [0.75, -0.55, 1100], [0.85, 0.1, 1100], [0, 0, 1600]];   // [x, y, ms] in units of max
  const loop = path.reduce((s, p) => s + p[2], 0);
  const autoTarget = t => {
    t %= loop;
    for (const p of path) { if (t < p[2]) return p; t -= p[2]; }
    return path[0];
  };
  document.querySelector('#hero .hero-img').addEventListener('click', e => {
    e.stopPropagation();   // shake instead of advancing
    const a = Math.random() * Math.PI * 2;
    v.x += Math.cos(a) * 30; v.y += Math.sin(a) * 30;
  });
  const tick = () => {
    if (slides[cur].id === 'hero') {
      const r = lens.getBoundingClientRect(), max = r.width * 0.225;
      const now = performance.now();
      const [ax, ay] = autoTarget(now - heroStart);
      let tx = ax * max, ty = ay * max;
      if (mouse && now - lastMove < 2000) {
        const dx = mouse.x - (r.left + r.width / 2), dy = mouse.y - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / (r.width * 0.9));
        tx = (dx / d) * max * k; ty = (dy / d) * max * k;
      }
      v.x = (v.x + (tx - pos.x) * 0.1) * 0.8;
      v.y = (v.y + (ty - pos.y) * 0.1) * 0.8;
      pos.x += v.x; pos.y += v.y;
      const m = Math.hypot(pos.x, pos.y);
      if (m > max) { pos.x *= max / m; pos.y *= max / m; }
      pupil.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();

/* ---------- hello: photo first, "אהלן" fades in on the first press ---------- */
const helloEl = document.getElementById('hello');
const hello = {
  enter() { helloEl.classList.remove('shown'); },
  next() { if (helloEl.classList.contains('shown')) return false; helloEl.classList.add('shown'); return true; },
};

const behaviours = { hello, interests, hats, hero,
  'evening-w': videoSlide('evening-w'), balkan: videoSlide('balkan') };

function go(n) {
  n = Math.max(0, Math.min(slides.length - 1, n));
  if (n === cur && slides[cur].classList.contains('on')) return;
  behaviours[slides[cur].id]?.leave?.();
  slides[cur].classList.remove('on');
  cur = n;
  slides[cur].classList.add('on');
  behaviours[slides[cur].id]?.enter?.();
  history.replaceState(null, '', '#' + (cur + 1));
}
function next() { if (behaviours[slides[cur].id]?.next?.()) return; go(cur + 1); }
function prev() { go(cur - 1); }

document.addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(slides.length - 1);
  else if (e.key === 'f' || e.key === 'F' || e.key === 'כ') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
});
document.addEventListener('click', next);

let idle;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 1500);
});

const start = parseInt(location.hash.slice(1), 10) - 1;
cur = Number.isInteger(start) && start >= 0 ? start : 0;
slides[cur].classList.add('on');
behaviours[slides[cur].id]?.enter?.();
</script>
</body>
</html>
